name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'

      - name: Install tools
        run: brew install create-dmg swiftlint

      - name: Determine version
        id: version
        # Strip the leading 'v' from the tag name using parameter expansion in bash.
        # GITHUB_REF_NAME is a fixed server-set variable, not user-controlled input.
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate third-party notices
        run: Scripts/generate-third-party-notices.sh

      - name: Import signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          echo "$SIGNING_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Store notarization credentials
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_PRIVATE_KEY: ${{ secrets.NOTARY_PRIVATE_KEY }}
        run: |
          echo "$NOTARY_PRIVATE_KEY" > /tmp/notary.p8
          xcrun notarytool store-credentials freedroid-notary \
            --key /tmp/notary.p8 \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"

      - name: Store Sparkle private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle-private.pem
          chmod 600 /tmp/sparkle-private.pem

      - name: Build, sign, notarize, package DMG
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          NOTARY_PROFILE: freedroid-notary
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: Scripts/build-release.sh "$APP_VERSION"

      - name: Sign appcast item
        env:
          SPARKLE_PRIVATE_KEY_PATH: /tmp/sparkle-private.pem
          APP_VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          Scripts/sparkle-sign.sh \
            "$APP_VERSION" \
            "build/release/FreeDroid-${APP_VERSION}.dmg" \
            "https://github.com/${REPO}/releases/tag/${REF_NAME}" \
            > /tmp/appcast-item.xml

      - name: Update appcast
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          ET.register_namespace('sparkle', 'http://www.andymatuschak.org/xml-namespaces/sparkle')
          tree = ET.parse('docs/appcast.xml')
          root = tree.getroot()
          channel = root.find('channel')

          with open('/tmp/appcast-item.xml') as f:
              item_text = f.read().strip()

          # Wrap in a dummy root so we can parse namespaced content
          wrapped = (
              '<root xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
              + item_text
              + '</root>'
          )
          item_root = ET.fromstring(wrapped)
          item = item_root.find('item')
          channel.append(item)
          tree.write('docs/appcast.xml', xml_declaration=True, encoding='unicode')
          PY

      - name: Commit appcast update
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "FreeDroid Release Bot"
          git config user.email "release-bot@freedroid.app"
          git add docs/appcast.xml
          git commit -m "release: appcast for v${APP_VERSION}" || echo "no changes"
          git push origin HEAD:main || echo "push failed — check branch protection"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        with:
          files: build/release/FreeDroid-${{ steps.version.outputs.version }}.dmg
          generate_release_notes: true
