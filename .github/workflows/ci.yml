name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict

  test-domain:
    name: Test FreeDroidDomain
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'
      - name: Build & test
        run: |
          cd Packages/FreeDroidDomain
          swift test --parallel

  test-ui:
    name: Test FreeDroidUI
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'
      - name: Build & test
        run: |
          cd Packages/FreeDroidUI
          swift test --parallel

  test-adb:
    name: Test FreeDroidADB
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'
      - name: Build & test
        run: |
          cd Packages/FreeDroidADB
          swift test --parallel

  test-mtp:
    name: Test FreeDroidMTP
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'
      - name: Build & test
        run: |
          cd Packages/FreeDroidMTP
          swift test --parallel

  test-data:
    name: Test FreeDroidData
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'
      - name: Build & test
        run: |
          cd Packages/FreeDroidData
          swift test --parallel

  test-device-mgmt:
    name: Test DeviceManagement
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'
      - name: Build & test
        run: |
          cd Packages/Features/DeviceManagement
          swift test --parallel

  test-browser:
    name: Test FileBrowser
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'
      - run: cd Packages/Features/FileBrowser && swift test --parallel

  build-app:
    name: Build FreeDroid app
    runs-on: macos-15
    needs: [test-domain, test-ui, test-adb, test-mtp, test-data, test-device-mgmt, test-browser]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build app
        run: |
          xcodebuild \
            -workspace FreeDroid.xcworkspace \
            -scheme FreeDroid \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
