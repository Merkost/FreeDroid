included:
  - FreeDroid
  - Packages

excluded:
  - .build
  - .swiftpm
  - DerivedData
  - Packages/FreeDroidDomain/.build
  - Packages/FreeDroidDomain/.swiftpm
  - Packages/FreeDroidUI/.build
  - Packages/FreeDroidUI/.swiftpm
  - Packages/FreeDroidADB/.build
  - Packages/FreeDroidADB/.swiftpm
  - Packages/FreeDroidMTP/.build
  - Packages/FreeDroidMTP/.swiftpm
  - Packages/FreeDroidData/.build
  - Packages/FreeDroidData/.swiftpm
  - Packages/Features/DeviceManagement/.build
  - Packages/Features/DeviceManagement/.swiftpm

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool

disabled_rules:
  - line_length
  - trailing_comma

force_cast: error
force_try: error
force_unwrapping: error

identifier_name:
  allowed_symbols: "_"
  validates_start_with_lowercase: true
  min_length:
    warning: 2
    error: 2
  excluded:
    - x
    - xs
    - sm
    - md
    - lg
    - xl
    - y

custom_rules:
  no_inline_comments:
    name: "No inline comments"
    regex: '^\s*//(?!\s*(MARK:|swiftlint:|TODO:|FIXME:|http|swift-tools-version|/))'
    message: "Code should be self-documenting. Use DocC /// on public API only."
    severity: warning
  no_print:
    name: "No print statements"
    regex: '\bprint\('
    match_kinds: identifier
    message: "Use os.Logger, not print."
    severity: error
