name: FreeDroid
options:
  bundleIdPrefix: com.merkost.freedroid
  deploymentTarget:
    macOS: "15.4"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO

packages:
  FreeDroidPackages:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  FreeDroid:
    type: application
    platform: macOS
    deploymentTarget: "15.4"
    sources:
      - path: FreeDroid
    configFiles:
      Debug: Configs/Local.xcconfig
      Release: Configs/Local.xcconfig
    resources:
      - path: FreeDroid/Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.merkost.freedroid
        INFOPLIST_FILE: FreeDroid/Info.plist
        CODE_SIGN_ENTITLEMENTS: FreeDroid/FreeDroid.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: FreeDroidPackages
        product: FreeDroidDomain
      - package: FreeDroidPackages
        product: FreeDroidUI
      - package: FreeDroidPackages
        product: FreeDroidData
      - package: FreeDroidPackages
        product: FreeDroidIPC
      - package: FreeDroidPackages
        product: DeviceManagement
      - package: FreeDroidPackages
        product: FileBrowser
      - package: FreeDroidPackages
        product: Gallery
      - package: FreeDroidPackages
        product: Transfer
      - package: Sparkle
        product: Sparkle
      - target: FreeDroidFS
        embed: true
        codeSign: true

  FreeDroidFS:
    type: extensionkit-extension
    platform: macOS
    deploymentTarget: "15.4"
    sources:
      - path: FreeDroidFS
    configFiles:
      Debug: Configs/Local.xcconfig
      Release: Configs/Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.merkost.freedroid.FreeDroidFS
        INFOPLIST_FILE: FreeDroidFS/Info.plist
        CODE_SIGN_ENTITLEMENTS: FreeDroidFS/FreeDroidFS.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
        PRODUCT_NAME: FreeDroidFS
        MACOSX_DEPLOYMENT_TARGET: "15.4"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../../../Frameworks"
    dependencies:
      - package: FreeDroidPackages
        product: FreeDroidDomain
      - package: FreeDroidPackages
        product: FreeDroidIPC
