name: FreeDroid
options:
  bundleIdPrefix: app.freedroid
  deploymentTarget:
    macOS: "15.4"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO

packages:
  FreeDroidDomain:
    path: Packages/FreeDroidDomain
  FreeDroidUI:
    path: Packages/FreeDroidUI
  FreeDroidADB:
    path: Packages/FreeDroidADB
  FreeDroidMTP:
    path: Packages/FreeDroidMTP
  FreeDroidData:
    path: Packages/FreeDroidData
  FreeDroidIPC:
    path: Packages/FreeDroidIPC
  DeviceManagement:
    path: Packages/Features/DeviceManagement
  FileBrowser:
    path: Packages/Features/FileBrowser
  Gallery:
    path: Packages/Features/Gallery
  Transfer:
    path: Packages/Features/Transfer
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  FreeDroid:
    type: application
    platform: macOS
    deploymentTarget: "15.4"
    sources:
      - path: FreeDroid
    resources:
      - path: FreeDroid/Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.freedroid.FreeDroid
        INFOPLIST_FILE: FreeDroid/Info.plist
        CODE_SIGN_ENTITLEMENTS: FreeDroid/FreeDroid.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: FreeDroidDomain
        product: FreeDroidDomain
      - package: FreeDroidUI
        product: FreeDroidUI
      - package: FreeDroidData
        product: FreeDroidData
      - package: FreeDroidIPC
        product: FreeDroidIPC
      - package: DeviceManagement
        product: DeviceManagement
      - package: FileBrowser
        product: FileBrowser
      - package: Gallery
        product: Gallery
      - package: Transfer
        product: Transfer
      - package: Sparkle
        product: Sparkle
      - target: FreeDroidFS
        embed: true
        codeSign: false

  FreeDroidFS:
    type: bundle
    platform: macOS
    deploymentTarget: "15.4"
    sources:
      - path: FreeDroidFS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.freedroid.FreeDroid.FreeDroidFS
        INFOPLIST_FILE: FreeDroidFS/Info.plist
        CODE_SIGN_ENTITLEMENTS: FreeDroidFS/FreeDroidFS.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
        WRAPPER_EXTENSION: fskitmodule
        PRODUCT_NAME: FreeDroidFS
        MACH_O_TYPE: mh_bundle
        MACOSX_DEPLOYMENT_TARGET: "15.4"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: FreeDroidDomain
        product: FreeDroidDomain
      - package: FreeDroidIPC
        product: FreeDroidIPC
